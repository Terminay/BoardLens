name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore RigSpec.slnx
      - name: Build
        run: dotnet build RigSpec.slnx -c Release --no-restore
      - name: Test
        run: dotnet test RigSpec.slnx -c Release --no-build --verbosity normal

  publish:
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish GUI
        run: dotnet publish src/RigSpec.App/RigSpec.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/gui-${{ matrix.rid }}
      - name: Publish CLI
        run: dotnet publish src/RigSpec.Cli/RigSpec.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/cli-${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: rigspec-${{ matrix.rid }}
          path: artifacts
