name: Feature request
description: Suggest a focused improvement to rigspec.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the user need the change would address. Please search existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that is currently difficult or unsupported?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
    validations:
      required: false
